name: preview release

# Publish a finished preview build as a draft release. The artifacts are unsigned (the macOS
# apps are re-signed ad hoc here) and carry no embedding resources, so the release body says
# so. The signed release stays in release.yml and needs the signing identities and
# per-target resources.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: The preview workflow run to publish
        required: true

permissions:
  contents: write
  actions: read

jobs:
  publish:
    # macOS, because codesign and hdiutil are what fix the downloaded macOS apps.
    runs-on: macos-15
    steps:
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts

      - name: Sign the macOS apps and rebuild their disk images
        run: |
          set -euo pipefail
          find artifacts -type d -name "openlab.app" | while read -r app; do
            echo "signing $app"
            # The artifact round-trip does not keep the executable bit, and a bundle
            # whose main binary is not executable is what macOS reports as unopenable.
            chmod +x "$app/Contents/MacOS/openlab"
            codesign --force --deep --sign - "$app"
            root="$(dirname "$(dirname "$app")")"
            dmg="$(find "$root/dmg" -maxdepth 1 -name '*.dmg' | head -1)"
            [ -n "$dmg" ] || continue

            # A staging folder, not the app alone: the DMG needs the Applications
            # shortcut beside the app, or there is nothing to drag it onto.
            stage="$(mktemp -d)"
            cp -R "$app" "$stage/openlab.app"
            chmod +x "$stage/openlab.app/Contents/MacOS/openlab"
            codesign --force --deep --sign - "$stage/openlab.app"
            ln -s /Applications "$stage/Applications"
            cat > "$stage/README.txt" <<'TXT'
          Drag openlab to Applications.

          First launch: open System Settings > Privacy & Security, scroll to Security,
          and click Open Anyway next to the openlab message. Or right-click openlab
          and choose Open.

          This preview is signed ad hoc, not notarised, so macOS asks once.
          TXT

            rm -f "$dmg"
            hdiutil create -volname openlab -srcfolder "$stage" -ov -format UDZO "$dmg" >/dev/null
            rm -rf "$stage"
            echo "rebuilt $dmg"
          done

      - name: List the installers
        run: find artifacts -type f | sort

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: preview-0.1.0
          name: openlab 0.1.0 Preview
          draft: true
          prerelease: true
          overwrite_files: true
          body: |
            # openlab 0.1.0 Preview

            The first public preview of **openlab**, the research workbench: an agent you can
            watch, a real workspace, and every result you can reproduce.

            ## Download

            | Platform | Build |
            | --- | --- |
            | macOS (Apple silicon) | `openlab_0.1.0_aarch64.dmg` |
            | macOS (Intel) | `openlab_0.1.0_x64.dmg` |
            | Windows (x64) | `openlab_0.1.0_x64-setup.exe` |
            | Linux (Debian, Ubuntu) | `openlab_0.1.0_amd64.deb` |
            | Linux (Fedora, RHEL) | `openlab-0.1.0-1.x86_64.rpm` |
            | Linux (portable) | `openlab_0.1.0_amd64.AppImage` |

            ## macOS: allow the first launch

            These preview builds are signed ad hoc, not notarized, so macOS blocks the first
            launch. This is expected and happens once.

            1. Open the DMG and drag **openlab** to **Applications**.
            2. Open **System Settings > Privacy & Security** and scroll to **Security**.
            3. Next to the message about openlab, click **Open Anyway**.
            4. Confirm with **Open**.

            Alternatively, right-click **openlab** in Applications and choose **Open**.

            A signed and notarized release will open without this step.

            ## Notes

            - Free and MIT licensed.
            - The optional PDF scan engine (embedding server) is not included in this preview.
              The rest of the workbench works.
            - Windows: SmartScreen may warn. Choose **More info > Run anyway**.
            - Linux: if the AppImage is not executable, run
              `chmod +x openlab_0.1.0_amd64.AppImage`.
            - Report issues at
              https://github.com/sciencedeltacom/openlab/issues.

            A signed and notarized 0.1.x release follows once the Apple and Windows signing
            identities are configured.
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.exe
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.AppImage
