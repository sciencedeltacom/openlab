name: preview release

# Publish a finished preview build as a draft release. The artifacts are unsigned (the macOS
# apps are re-signed ad hoc here) and carry no embedding resources, so the release body says
# so. The signed release stays in release.yml and needs the signing identities and
# per-target resources.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: The preview workflow run to publish
        required: true

permissions:
  contents: write
  actions: read

jobs:
  publish:
    # macOS, because codesign and hdiutil are what fix the downloaded macOS apps.
    runs-on: macos-15
    steps:
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts

      - name: Sign the macOS apps and rebuild their disk images
        run: |
          set -euo pipefail
          find artifacts -type d -name "openlab.app" | while read -r app; do
            echo "signing $app"
            codesign --force --deep --sign - "$app"
            root="$(dirname "$(dirname "$app")")"
            dmg="$(find "$root/dmg" -maxdepth 1 -name '*.dmg' | head -1)"
            [ -n "$dmg" ] || continue

            # A staging folder, not the app alone: the DMG needs the Applications
            # shortcut beside the app, or there is nothing to drag it onto.
            stage="$(mktemp -d)"
            cp -R "$app" "$stage/openlab.app"
            codesign --force --deep --sign - "$stage/openlab.app"
            ln -s /Applications "$stage/Applications"
            cat > "$stage/README.txt" <<'TXT'
          Drag openlab to Applications.

          The first time you open it, right-click openlab and choose Open. macOS asks once
          because this preview is signed ad hoc, not notarised.
          TXT

            rm -f "$dmg"
            hdiutil create -volname openlab -srcfolder "$stage" -ov -format UDZO "$dmg" >/dev/null
            rm -rf "$stage"
            echo "rebuilt $dmg"
          done

      - name: List the installers
        run: find artifacts -type f | sort

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: preview-0.1.0
          name: openlab 0.1.0 preview
          draft: true
          prerelease: true
          overwrite_files: true
          body: |
            Preview builds for macOS, Windows and Linux.

            The macOS apps are signed ad hoc, not notarised: macOS will ask you to confirm the
            first open (right-click, Open), but the bundle is no longer reported as damaged. The
            Windows and Linux builds are unsigned. The optional embedding resources are not
            included, so the PDF scan engine is absent. A signed and notarised release follows
            once the certificates and the per-target resources are configured.

            - macOS: Apple silicon and Intel, DMG
            - Windows: x64, NSIS installer
            - Linux: x64, deb, rpm and AppImage
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.exe
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.AppImage
