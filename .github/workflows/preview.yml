name: preview

# Unsigned installers for trying the app before a signed release exists. The embedding
# resources are left out, so the scan engine is absent and the app degrades as designed.
# This workflow uploads build artifacts and never publishes a release.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
          - platform: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage,rpm
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libsodium-dev pkg-config rpm

      - name: macOS dependencies
        if: matrix.platform == 'macos-15' || matrix.platform == 'macos-15-intel'
        run: brew install libsodium pkg-config

      - name: Windows dependencies
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          vcpkg install libsodium:x64-windows-static-md
          $root = $env:VCPKG_INSTALLATION_ROOT
          "VCPKG_ROOT=$root" >> $env:GITHUB_ENV
          "VCPKGRS_TRIPLET=x64-windows-static-md" >> $env:GITHUB_ENV

      - name: Build the installer
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          # Without an identity Tauri leaves the linker's ad-hoc signature on the binary,
          # which macOS reads as a damaged bundle. `-` signs the bundle ad hoc so it opens
          # with the standard unidentified-developer prompt instead.
          APPLE_SIGNING_IDENTITY: '-'
        run: |
          bun install --frozen-lockfile
          bun run build
          bunx tauri build \
            --target ${{ matrix.target }} \
            --bundles ${{ matrix.bundles }} \
            --config '{"bundle":{"resources":["resources/worker"],"createUpdaterArtifacts":false}}'

      # The binary is linked against the build machine's Homebrew libsodium. Nothing on a
      # user's Mac has that path, so the dylib travels inside the app.
      - name: Bundle libsodium
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        run: |
          APP="src-tauri/target/${{ matrix.target }}/release/bundle/macos/openlab.app"
          BIN="$APP/Contents/MacOS/openlab"
          LIB="$(ls "$(brew --prefix libsodium)"/lib/libsodium.*.dylib | head -1)"
          NAME="$(basename "$LIB")"
          OLD="$(otool -L "$BIN" | awk '/libsodium.*dylib/ {print $1; exit}')"
          mkdir -p "$APP/Contents/Frameworks"
          cp "$LIB" "$APP/Contents/Frameworks/$NAME"
          install_name_tool -id "@rpath/$NAME" "$APP/Contents/Frameworks/$NAME"
          install_name_tool -change "$OLD" "@rpath/$NAME" "$BIN"
          if ! otool -l "$BIN" | grep -q "@executable_path/../Frameworks"; then
            install_name_tool -add_rpath "@executable_path/../Frameworks" "$BIN"
          fi
          codesign --force --deep --sign - "$APP"

      - uses: actions/upload-artifact@v4
        with:
          name: openlab-preview-${{ matrix.target }}
          if-no-files-found: error
          path: src-tauri/target/${{ matrix.target }}/release/bundle/**
