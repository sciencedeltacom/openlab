name: tag cleanup

# One-off: remove tag refs left behind by a draft release that was published without a tag.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete the stray tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for tag in untagged-51cf9aaa57cdd5dd7aad preview-0.1.0; do
            gh api -X DELETE "/repos/${{ github.repository }}/git/refs/tags/$tag" && echo "deleted $tag"
          done
