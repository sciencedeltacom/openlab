name: preview rpm

# One Linux rpm for a preview that predates the rpm bundle in the main preview matrix.
# Manual only: the normal preview builds all three Linux formats.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libsodium-dev pkg-config rpm

      - name: Build the rpm
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          bun install --frozen-lockfile
          bun run build
          bunx tauri build \
            --target x86_64-unknown-linux-gnu \
            --bundles rpm \
            --config '{"bundle":{"resources":["resources/worker"],"createUpdaterArtifacts":false}}'

      - uses: actions/upload-artifact@v4
        with:
          name: openlab-preview-rpm
          if-no-files-found: error
          path: src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/rpm/*.rpm
