name: verify

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web, CLI and verifiers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # One list, in package.json: the workflow used to repeat it, and the two drifted.
      - name: Formatting
        run: bunx prettier --check "src/**/*.{ts,tsx,css}" "cli/src/**/*.ts"
      - name: Dependency audit
        # The app's own tree is clean: katex and esbuild are pinned by overrides in
        # package.json. A new advisory should stop the build rather than be read past.
        run: bun audit --audit-level=moderate
      - name: Typecheck and verifiers
        run: bun run verify:web
      - name: Containment tests
        run: bun test cli/src/lib/host cli/src/lib/ui.test.ts
      - run: bun run build
      - name: Browser end-to-end smoke tests
        # The preview server serves `dist/`, so the build above has to come first. Chromium's
        # system libraries are not on the runner by default, hence `--with-deps`.
        run: |
          bunx playwright install --with-deps chromium
          bun run verify:e2e

  rust:
    name: Rust
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libsodium-dev pkg-config
      - name: Frontend bundle the shell embeds
        run: |
          bun install --frozen-lockfile
          bun run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib
