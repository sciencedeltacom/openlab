name: verify

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web, CLI and verifiers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      # The CLI's git tests make a real commit in a temporary workspace.
      - name: Git identity
        run: |
          git config --global user.name "openlab CI"
          git config --global user.email "ci@openlab.dev"
      - run: bun install --frozen-lockfile
      # One list, in package.json: the workflow used to repeat it, and the two drifted.
      - name: Formatting
        run: bunx prettier --check "src/**/*.{ts,tsx,css}" "cli/src/**/*.ts"
      - name: Dependency audit
        # High and critical advisories stop the build. Moderate advisories in the CLI
        # toolchain are tracked by Dependabot instead of blocking every change.
        run: bun audit --audit-level=high
      - name: Typecheck and verifiers
        run: bun run verify:web
      - name: Containment tests
        run: bun test cli/src/lib/host cli/src/lib/ui.test.ts
      - name: Build the bundle
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: bun run build
      - name: Browser end-to-end smoke tests
        # The preview server serves `dist/`, so the build above has to come first. Chromium's
        # system libraries are not on the runner by default, hence `--with-deps`.
        run: |
          bunx playwright install --with-deps chromium
          bun run verify:e2e

  rust:
    name: Rust
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Git identity
        run: |
          git config --global user.name "openlab CI"
          git config --global user.email "ci@openlab.dev"
      # tauri-build checks that every bundled resource path exists. The binaries are
      # gitignored and only a release needs them, so the checks run against empty dirs.
      - name: Resource placeholders
        run: mkdir -p src-tauri/resources/bin src-tauri/resources/mojo
      - uses: dtolnay/rust-toolchain@stable
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libsodium-dev pkg-config
      - name: Frontend bundle the shell embeds
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          bun install --frozen-lockfile
          bun run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib
