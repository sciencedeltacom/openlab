name: close dependabot prs

# One-off: the merge token on this machine cannot write, so the pull requests the squashed
# commits landed by hand are closed here, and their now-redundant branches removed.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - name: Close the merged pull requests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment 1 --body "Landed on main as fd2fbc06, squashed by hand because the local token has no write access." || true
          gh pr close 1 || true
          gh pr comment 3 --body "Landed on main as 84c4cb4a, squashed by hand because the local token has no write access." || true
          gh pr close 3 || true

      - name: Close the one that failed dependency review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment 2 --body "Closing for now: dependency review fails on this group, so the nine crate bumps need to be split or pinned before they can land. Dependabot will open a fresh one on the next run." || true
          gh pr close 2 || true

      - name: Remove the stale branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for branch in \
            dependabot/github_actions/actions-8e1c61df11 \
            dependabot/cargo/src-tauri/rustls-0.23.46 \
            dependabot/cargo/src-tauri/rust-minor-893de1b47d; do
            gh api -X DELETE "/repos/${{ github.repository }}/git/refs/heads/$branch" && echo "deleted $branch" || true
          done
